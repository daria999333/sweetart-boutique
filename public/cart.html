<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | SweetArt Boutique</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <nav class="navbar">
                <a href="index.html" class="logo">🍰 SweetArt Boutique</a>
                <ul class="nav-links">
                    <li><a href="index.html">Catalog</a></li>
                    <li><a href="cart.html" class="active">Cart ({{ cartCount }})</a></li>
                </ul>
            </nav>
        </header>

        <main class="container">
            <h1 class="page-title">Your Shopping Cart</h1>

            <div v-if="cart.length === 0" style="text-align: center; padding: 3rem;">
                <p style="font-size: 1.2rem; color: #666; margin-bottom: 1.5rem;">Your cart is currently empty.</p>
                <a href="index.html" class="btn" style="text-decoration: none; display: inline-block;">Browse Catalog</a>
            </div>

            <div v-else class="cart-layout">
                <div class="cart-items">
                    <div v-for="item in cart" :key="item.id" class="cart-item">
                        <div>
                            <h4 style="font-weight: 600;">{{ item.name }}</h4>
                            <p style="color: #666; font-size: 0.9rem;">${{ item.price.toFixed(2) }} x {{ item.quantity }}</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <span style="font-weight: bold; color: var(--accent-color);">${{ (item.price * item.quantity).toFixed(2) }}</span>
                            <button @click="removeFromCart(item.id)" class="btn" style="background-color: var(--danger); padding: 0.25rem 0.5rem; font-size: 0.8rem;">Remove</button>
                        </div>
                    </div>
                    <div style="margin-top: 1.5rem; text-align: right; font-size: 1.2rem; font-weight: bold;">
                        Total: ${{ cartTotal.toFixed(2) }}
                    </div>
                </div>

                <div class="checkout-form">
                    <h3 style="margin-bottom: 1rem; color: var(--accent-color);">Checkout Details</h3>
                    <form @app.prevent @submit.prevent="submitOrder">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" v-model="form.customer_name" required placeholder="Anna Pavlyk">
                        </div>
                        <div class="form-group">
                            <label>Delivery Address</label>
                            <input type="text" v-model="form.address" required placeholder="123 Ivanovsky St">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" v-model="form.phone" required placeholder="+380 234 567 890">
                        </div>
                        <button type="submit" class="btn btn-block">Place Order</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
